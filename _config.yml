# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing these this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: wiki
email: gkstjgus0028@gmail.com
author: Z
description: > # this means to ignore newlines until "baseurl:"
  게임의 세계관과 스토리부터 캐릭터, 아이템, 시스템, 콘텐츠까지 다양한 정보를 정리한 게임 위키입니다.
  게임에 관한 모든 정보를 체계적으로 확인하고 탐색할 수 있습니다.

# Add your baseurl here (your repository) but DO NOT CHANGE THE LINE NUMBER without editing .circleci/circle_urls.sh
baseurl: "/game_wiki" # the subpath of your site, e.g. /blog

# This is mostly for testing
url: "https://monster1365.github.io" # the base hostname & protocol for your site

# Keywords (space separated)
keywords: "게임 위키 게임 정보 게임 공략 캐릭터 아이템 시스템 세계관"

# Add colorful permalinks to headers
# change colors in _includes/permalinks.html
add_permalinks: true

# Optional
# twitter: vsoch
# linkedin: vsochat
# support: https://github.com/vsoch/tw-jekyll/issues
# repo: https://github.com/vsoch/tw-jekyll
# github_user: vsoch
# github_repo: tw-jekyll
# discord: https://community.discord.com

# If you have a logo, put here to include in meta tags
logo: assets/img/tw-jekyll.png

# branch to edit on GitHub
github_branch: main

# If not set, badge color (background) defaults to violet
# badge_color: "#2bcf98"
badge_rounded: true

# Build settings
markdown: kramdown

# If you add tags to pages, define this variable to link them to some external search
# If you want to link to tags locally on the site, leave this commented out
# tag_search_endpoint: https://ask.cyberinfrastructure.org/search?q=
tag_color: primary # danger, success, warning, primary, info, secondary

accentColor: red # purple, green, etc.
themeColor: red # purple, green, blue, orange, purple, grey
fixedNav: 'true' # true or false

permalink: /:year/:title/
markdown: kramdown
exclude: [_site, CHANGELOG.md, LICENSE, README.md, vendor]

# Collections
collections:
  docs:
    output: true
    permalink: /:collection/:path

# Defaults
defaults:
  - scope:
      path: "_docs"
      type: "docs"
    values:
      layout: page
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  -
    scope:
      path: "posts"
      type: "posts"
    values:
      layout: "post"
